      UserRestControllerV1Tests#testCreateUserSuccess and
      UserService{H2Jdbc,HsqlJdbc,Jpa,SpringDataJpa}Tests#shouldAddUser.
      Note: service tests run once per persistence profile, so one mutation in shared code
      fails several test classes. Ground truth must list all of them.
