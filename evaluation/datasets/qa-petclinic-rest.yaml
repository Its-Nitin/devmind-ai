# Seed QA benchmark for spring-petclinic-rest (20 of the planned 50).
# Labelled by reading the code at the pinned SHA, before any DevMind tooling existed (M0 step 6).
# Paths are relative to the target repo root. Line ranges are inclusive and include annotations.
# Holdout questions (split: holdout) are never used for tuning; one per main category.
datasetVersion: 1
target: petclinic-rest
revision: 5180cc9bd0163393c4e628bedc1bc4c27cfaab1b
questions:

  # ---------------------------------------------------------------- symbol_lookup (4)
  - id: q001
    category: symbol_lookup
    split: dev
    question: "Where is the REST endpoint that returns a single owner by its id implemented?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/OwnerRestControllerV1.java"
        symbol: "OwnerRestControllerV1#getOwner(Integer)"
        lines: "89-97"
    mustAbstain: false
    notes: "Gist: OwnerRestControllerV1.getOwner loads the owner via ClinicService.findOwnerById and returns 404 if null, else the mapped OwnerDto. Phrased without the class name on purpose. The URL mapping itself lives in the generated OwnersApi interface (target/), not in source."

  - id: q002
    category: symbol_lookup
    split: dev
    question: "Where is the check that rejects a pet whose birth date is in the future?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/validation/PetAgeValidator.java"
        symbol: "PetAgeValidator#isValid(LocalDate, ConstraintValidatorContext)"
        lines: "10-36"
    mustAbstain: false
    notes: "Gist: PetAgeValidator.isValid returns false with 'Birth date cannot be in the future' when birthDate is after today (and also rejects dates older than 50 years; null is valid). Phrased without identifiers."

  - id: q003
    category: symbol_lookup
    split: holdout
    question: "Where is the endpoint that lists owners page by page implemented?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v2/OwnerRestControllerV2.java"
        symbol: "OwnerRestControllerV2#listOwnersPage(String, Integer, Integer)"
        lines: "31-40"
    mustAbstain: false
    notes: "Gist: the v2 controller's listOwnersPage defaults to page 0, size 20, sorted by id, and calls ClinicService.findOwners(lastName, PageRequest). Phrased without identifiers."

  - id: q004
    category: symbol_lookup
    split: dev
    question: "Where is the JPQL query for SpringDataOwnerRepository.findByLastName defined?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataOwnerRepository.java"
        symbol: "SpringDataOwnerRepository#findByLastName(String)"
        lines: "39-41"
    mustAbstain: false
    notes: "Gist: an @Query on SpringDataOwnerRepository.findByLastName(String) — SELECT DISTINCT owner ... left join fetch owner.pets WHERE owner.lastName LIKE :lastName%. Identifier-based on purpose (lexical-retrieval case). A paginated overload exists at lines 43-47; either is acceptable as a hit only if it overlaps 39-41."

  # ---------------------------------------------------------------- explanation (3)
  - id: q005
    category: explanation
    split: dev
    question: "What happens when a new user is created with a role name that doesn't start with ROLE_?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/service/UserServiceImpl.java"
        symbol: "UserServiceImpl#saveUser(User)"
        lines: "16-35"
    mustAbstain: false
    notes: "Gist: saveUser throws IllegalArgumentException if the user has no roles; otherwise it prefixes each role name with 'ROLE_' if missing, links each role back to the user, and saves the user."

  - id: q006
    category: explanation
    split: holdout
    question: "How does the API turn validation failures in a request body into an error response?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/advice/ExceptionControllerAdvice.java"
        symbol: "ExceptionControllerAdvice#handleMethodArgumentNotValidException(MethodArgumentNotValidException, HttpServletRequest)"
        lines: "117-148"
      - path: "src/main/java/org/springframework/samples/petclinic/rest/advice/ExceptionControllerAdvice.java"
        symbol: "ExceptionControllerAdvice#detailBuild(Exception, HttpStatus, StringBuffer, String)"
        lines: "63-71"
    mustAbstain: false
    notes: "Gist: a @ControllerAdvice handler returns HTTP 400 with an RFC 7807 ProblemDetail (title = exception class, detail = 'The request contains invalid or missing parameters', timestamp) whose schemaValidationErrors lists each field error with field name, rejected value and message."

  - id: q007
    category: explanation
    split: dev
    question: "What does the application do when looking up an entity by id finds nothing?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/service/ClinicServiceImpl.java"
        symbol: "ClinicServiceImpl#findEntityById(Supplier)"
        lines: "257-264"
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/OwnerRestControllerV1.java"
        symbol: "OwnerRestControllerV1#getOwner(Integer)"
        lines: "89-97"
    mustAbstain: false
    notes: "Gist: ClinicServiceImpl.findEntityById catches ObjectRetrievalFailureException / EmptyResultDataAccessException (thrown by JPA/JDBC impls) and returns null; controllers check for null and return 404 NOT_FOUND. Any one controller null-check is acceptable as the second item; getOwner is the canonical one."

  # ---------------------------------------------------------------- cross_file_trace (3)
  - id: q008
    category: cross_file_trace
    split: dev
    question: "Trace adding a new pet to an existing owner, from the HTTP request down to persistence."
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/OwnerRestControllerV1.java"
        symbol: "OwnerRestControllerV1#addPetToOwner(Integer, PetFieldsDto)"
        lines: "139-156"
      - path: "src/main/java/org/springframework/samples/petclinic/service/ClinicServiceImpl.java"
        symbol: "ClinicServiceImpl#savePet(Pet)"
        lines: "212-217"
      - path: "src/main/java/org/springframework/samples/petclinic/repository/PetRepository.java"
        symbol: "PetRepository#save(Pet)"
        lines: "62"
    mustAbstain: false
    notes: "Gist: addPetToOwner loads the owner (404 if missing), maps PetFieldsDto to Pet, sets the owner, clears the type name, calls ClinicService.savePet, which reloads the PetType by id and calls PetRepository.save; returns 201 with a Location header /api/pets/{id}. With default profiles PetRepository is the Spring Data proxy (SpringDataPetRepository)."

  - id: q009
    category: cross_file_trace
    split: holdout
    question: "What happens step by step when a pet type is deleted through the API with the default profiles?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/PetTypeRestControllerV1.java"
        symbol: "PetTypeRestControllerV1#deletePetType(Integer)"
        lines: "93-103"
      - path: "src/main/java/org/springframework/samples/petclinic/service/ClinicServiceImpl.java"
        symbol: "ClinicServiceImpl#deletePetType(PetType)"
        lines: "164-168"
      - path: "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataPetTypeRepositoryImpl.java"
        symbol: "SpringDataPetTypeRepositoryImpl#delete(PetType)"
        lines: "39-54"
    mustAbstain: false
    notes: "Gist: the controller (VET_ADMIN only) looks up the type (404 if missing) and calls ClinicService.deletePetType -> PetTypeRepository.delete, which under spring-data-jpa is the custom SpringDataPetTypeRepositoryImpl: it removes the type, then deletes every visit of every pet of that type, those pets, and finally the type via JPQL DELETE statements."

  - id: q010
    category: cross_file_trace
    split: dev
    question: "How does searching owners by last name work, from the v1 endpoint down to the query?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/OwnerRestControllerV1.java"
        symbol: "OwnerRestControllerV1#listOwners(String)"
        lines: "74-87"
      - path: "src/main/java/org/springframework/samples/petclinic/service/ClinicServiceImpl.java"
        symbol: "ClinicServiceImpl#findOwnerByLastName(String)"
        lines: "239-243"
      - path: "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataOwnerRepository.java"
        symbol: "SpringDataOwnerRepository#findByLastName(String)"
        lines: "39-41"
    mustAbstain: false
    notes: "Gist: listOwners calls findOwnerByLastName when lastName is given (else findAllOwners); the Spring Data query does a prefix LIKE match with pets fetch-joined; an empty result returns 404 rather than an empty list."

  # ---------------------------------------------------------------- dependency_callers (3)
  - id: q011
    category: dependency_callers
    split: dev
    question: "Which REST endpoints would be affected if ClinicService.savePet changed?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/OwnerRestControllerV1.java"
        symbol: "OwnerRestControllerV1#addPetToOwner(Integer, PetFieldsDto)"
        lines: "139-156"
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/OwnerRestControllerV1.java"
        symbol: "OwnerRestControllerV1#updateOwnersPet(Integer, Integer, PetFieldsDto)"
        lines: "158-173"
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/PetRestControllerV1.java"
        symbol: "PetRestControllerV1#updatePet(Integer, PetDto)"
        lines: "73-85"
    mustAbstain: false
    notes: "Gist: three production callers — addPetToOwner, updateOwnersPet and PetRestControllerV1.updatePet. Verified: `git grep -n 'savePet(' -- src/main`."

  - id: q012
    category: dependency_callers
    split: dev
    question: "What applies the pet birth-date validation annotation, and to which field?"
    expected:
      - path: "src/main/resources/openapi.yml"
        lines: "2166-2172"
      - path: "src/main/java/org/springframework/samples/petclinic/rest/validation/PetAgeValidation.java"
        symbol: "PetAgeValidation"
        lines: "7-18"
    mustAbstain: false
    notes: "Gist: no hand-written Java uses @PetAgeValidation; openapi.yml adds it via x-field-extra-annotation on the PetFields birthDate property, so openapi-generator puts it on the generated DTO in target/. The annotation is bound to PetAgeValidator via @Constraint(validatedBy). Verified: `git grep -n PetAgeValidation -- src/main`. Tests the static-analysis blind spot for generated code."

  - id: q013
    category: dependency_callers
    split: holdout
    question: "What calls the service method that saves a user account?"
    expected:
      - path: "src/main/java/org/springframework/samples/petclinic/rest/controller/v1/UserRestControllerV1.java"
        symbol: "UserRestControllerV1#addUser(UserDto)"
        lines: "46-53"
    mustAbstain: false
    notes: "Gist: only UserRestControllerV1.addUser (ADMIN role) calls UserService.saveUser. Verified: `git grep -n 'saveUser(' -- src/main`."

  # ---------------------------------------------------------------- config_behaviour (2)
  - id: q014
    category: config_behaviour
    split: dev
    question: "With default settings, which database and which persistence implementation does the app use, and how is that chosen?"
    expected:
      - path: "src/main/resources/application.properties"
        lines: "20-32"
      - path: "src/main/java/org/springframework/samples/petclinic/repository/springdatajpa/SpringDataOwnerRepository.java"
        symbol: "SpringDataOwnerRepository"
        lines: "36-37"
    mustAbstain: false
    notes: "Gist: spring.profiles.active=h2,spring-data-jpa — an H2 database initialised from db/h2/schema.sql and data.sql on every start, and Spring Data JPA repositories; the jdbc/jpa/spring-data-jpa repository implementations are selected by @Profile annotations. Any spring-data-jpa @Profile site is acceptable as the second item."

  - id: q015
    category: config_behaviour
    split: dev
    question: "Is authentication required to call the API out of the box, and what turns it on?"
    expected:
      - path: "src/main/resources/application.properties"
        lines: "47-49"
      - path: "src/main/java/org/springframework/samples/petclinic/security/DisableSecurityConfig.java"
        symbol: "DisableSecurityConfig"
        lines: "15-33"
      - path: "src/main/java/org/springframework/samples/petclinic/security/BasicAuthenticationConfig.java"
        symbol: "BasicAuthenticationConfig"
        lines: "18-55"
    mustAbstain: false
    notes: "Gist: no — petclinic.security.enable=false activates DisableSecurityConfig (permitAll, CSRF off). Setting it to true activates BasicAuthenticationConfig: HTTP Basic, users/roles loaded via JDBC, BCrypt, and @EnableMethodSecurity so the @PreAuthorize role checks are enforced (they are not enforced when security is disabled)."

  # ---------------------------------------------------------------- abstention (3)
  - id: q016
    category: abstention
    split: dev
    question: "Which email service does the application use to send visit reminders?"
    expected: []
    mustAbstain: true
    notes: "Verified absent: `git grep -n -i -E 'mail|smtp|reminder' -- src/main` returns only the Swagger contact e-mail in SwaggerConfig.java:57. No mail dependency in pom.xml."

  - id: q017
    category: abstention
    split: dev
    question: "How is the invoice amount calculated for a vet visit?"
    expected: []
    mustAbstain: true
    notes: "Verified absent: `git grep -n -i -E 'payment|invoice|billing|price' -- src` returns no hits. Visit has only date and description."

  - id: q018
    category: abstention
    split: dev
    question: "How does the system check a vet's availability before booking an appointment?"
    expected: []
    mustAbstain: true
    notes: "Verified absent: `git grep -n -i -E 'schedul|availab|appointment|calendar' -- src/main` returns no hits. Visits are created without any availability check (OwnerRestControllerV1#addVisitToOwner)."

