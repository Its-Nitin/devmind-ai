# Dependency updates (SEC-10).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Angular packages must move together, or the build breaks on mismatched versions.
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@angular-eslint/*']
      primeng:
        patterns: ['primeng', '@primeuix/*', 'primeicons']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
