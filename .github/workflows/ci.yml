# Every quality gate enforcing from day one (M1 step 12, ADR-0013).
# Jobs: backend (./mvnw verify runs all gates), frontend (types, format, lint, tests, build),
# secrets (gitleaks over full history). The commitlint job is skipped in solo mode
# (coding-standards GIT, solo-mode note).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Enforcer, Error Prone + NullAway, tests (Testcontainers pgvector, Modulith, ArchUnit),
      # Spotless, Checkstyle, JaCoCo.
      - run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # API-10, FE-7: the committed TS types must match the committed backend contract.
      - name: API types match backend/openapi.json
        run: npm run api:types && git diff --exit-code -- src/app/core/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # SEC-6, GIT-5. Pinned official image instead of gitleaks-action: the action downloads an
      # old release from a renamed repo (504s), and the image matches the local pre-check.
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
