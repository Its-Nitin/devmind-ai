# Local development against the compose database (127.0.0.1:5432). Set DB_PASSWORD and DEVMIND_SEED_PASSWORD (the
# demo user's password, 12-72 characters) in your shell. Startup fails without them. The demo user comes from the
# demo profile, which local includes (profile group in application.yaml).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devmind
    username: devmind
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: false # plain http on localhost

logging:
  structured:
    format:
      console: ecs # OBS-1
  level:
    com.devmind: DEBUG
