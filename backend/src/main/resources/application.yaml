# Baseline for every profile. Profiles: local, test, eval, prod (SPRING-4). No secrets in any file:
# credentials come from environment variables only (SEC-6).
spring:
  application:
    name: devmind
  jpa:
    open-in-view: false # SPRING-3
    hibernate:
      ddl-auto: validate # SPRING-3: Flyway owns the schema (DB-1)
  threads:
    virtual:
      enabled: true # JAVA-11
  servlet:
    multipart:
      enabled: false # no uploads in v1

server:
  error:
    include-stacktrace: never # API-3
    include-message: never
  tomcat:
    max-swallow-size: 1MB
  servlet:
    session:
      tracking-modes: cookie # never ;jsessionid in URLs
      cookie: # SEC-7; local turns off secure for plain-http localhost
        http-only: true
        secure: true
        same-site: lax

springdoc: # API-10: the generated spec is committed as backend/openapi.json (OpenApiContractTest)
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  paths-to-match: /api/**
  default-produces-media-type: application/json
  override-with-generic-response: false # error responses are declared by rule (OpenApiConfiguration), not guessed
  writer-with-order-by-keys: true # stable key order, so the committed spec diffs cleanly
  model-converters:
    java-nullable-property-customizer:
      enabled: true # JSpecify @Nullable becomes a nullable schema; everything else is required (OpenApiConfiguration)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # SPRING-5

logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{userId:-}] " # OBS-1, plain-text logs
