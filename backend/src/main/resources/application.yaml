# Baseline for every profile. Profiles: local, test, eval, prod (SPRING-4), plus demo, an add-on that seeds the demo
# user. No secrets in any file: credentials come from environment variables only (SEC-6).
spring:
  application:
    name: devmind
  profiles:
    group:
      local: demo # local development always has the demo user
  jpa:
    open-in-view: false # SPRING-3
    hibernate:
      ddl-auto: validate # SPRING-3: Flyway owns the schema (DB-1)
  threads:
    virtual:
      enabled: true # JAVA-11
  servlet:
    multipart:
      enabled: false # no uploads in v1

devmind:
  ai:
    embedding: # ADR-0006 M0 decision (EmbeddingProperties); the model's digest is read from Ollama at startup
      provider: ollama
      base-url: http://localhost:11434 # server config only, never from a request
      model: mxbai-embed-large
      dimensions: 1024 # fixed by the chunk_embedding column; a model of another size is refused at startup
      document-prefix: ""
      query-prefix: "Represent this sentence for searching relevant passages: "
      batch-size: 16
      connect-timeout: 5s
      read-timeout: 2m # one batch on CPU: ~1.6 s per text measured in M0
  job: # ADR-0009 worker and retry tuning (JobProperties)
    worker-enabled: true
    poll-interval: 1s
    max-concurrent: 2
    lease-duration: 5m # handlers heartbeat well within this; a crashed worker's job is reclaimed after it
    max-attempts: 3
    retry-base-delay: 10s # doubles per attempt, with jitter (ERR-3)
    retry-max-delay: 10m
    progress-interval: 1s
    shutdown-timeout: 30s
  indexing: # IndexingProperties
    batch-size: 500 # files per write batch, one transaction each (DB-8)
  ingestion: # SEC-2/SEC-3 source rules and limits (IngestionProperties); only server config can widen them
    allowed-roots: [] # LOCAL sources are rejected until the operator lists directories; each must exist at startup
    allowed-hosts: [github.com, gitlab.com] # exact host names for GIT_PUBLIC sources
    clone-directory: ${java.io.tmpdir}/devmind-clones # one instance only: stale clones are swept at startup
    clone-timeout: 2m
    max-clone-size: 200MB
    max-files: 20000
    max-file-size: 512KB # larger files are skipped and counted

server:
  error:
    include-stacktrace: never # API-3
    include-message: never
  tomcat:
    max-swallow-size: 1MB
  servlet:
    session:
      tracking-modes: cookie # never ;jsessionid in URLs
      cookie: # SEC-7; local turns off secure for plain-http localhost
        http-only: true
        secure: true
        same-site: lax

springdoc: # API-10: the generated spec is committed as backend/openapi.json (OpenApiContractTest)
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  paths-to-match: /api/**
  default-produces-media-type: application/json
  override-with-generic-response: false # error responses are declared by rule (OpenApiConfiguration), not guessed
  writer-with-order-by-keys: true # stable key order, so the committed spec diffs cleanly
  model-converters:
    java-nullable-property-customizer:
      enabled: true # JSpecify @Nullable becomes a nullable schema; everything else is required (OpenApiConfiguration)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # SPRING-5

logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{userId:-}] " # OBS-1, plain-text logs
