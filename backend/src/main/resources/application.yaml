# Baseline for every profile. Profiles: local, test, eval, prod (SPRING-4). No secrets in any file:
# credentials come from environment variables only (SEC-6).
spring:
  application:
    name: devmind
  jpa:
    open-in-view: false # SPRING-3
    hibernate:
      ddl-auto: validate # SPRING-3: Flyway owns the schema (DB-1)
  threads:
    virtual:
      enabled: true # JAVA-11
  servlet:
    multipart:
      enabled: false # no uploads in v1

server:
  error:
    include-stacktrace: never # API-3
    include-message: never
  tomcat:
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # SPRING-5

logging:
  pattern:
    correlation: "[%X{correlationId:-}] " # OBS-1, plain-text logs
