# Integration tests. The datasource comes from Testcontainers (@ServiceConnection). Plain-text logs for readable
# test output.
logging:
  level:
    com.devmind: DEBUG

devmind:
  job:
    # Tests drive JobRunner directly, or start the worker themselves (JobWorkerTest), so nothing polls in the
    # background of unrelated tests.
    worker-enabled: false
  indexing:
    batch-size: 2 # small fixtures still cross batch boundaries (resume-after-crash tests)
  ingestion:
    allowed-roots: ["${java.io.tmpdir}"] # JUnit @TempDir fixture repositories live under it
    clone-directory: ${java.io.tmpdir}/devmind-test-clones
